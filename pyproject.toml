[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "huginn-private"
version = "0.1.0"
description = "Private static package reconnaissance and review capture"
requires-python = ">=3.13"
authors = [{name = "OpenSource-For-Freedom"}]
license = {text = "Private"}
dependencies = []

[project.scripts]
huginn-capture = "huginn.capture:main"
huginn-review-validate = "huginn.review_validate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
huginn = ["rules/*.yml"]
