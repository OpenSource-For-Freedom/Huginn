name: Hunt 002 Candidate Review

on:
  push:
    branches:
      - feature/security-candidate-review

permissions:
  contents: read

env:
  HUGINN_TRIVY_IMAGE: docker.io/aquasec/trivy:0.74.0
  HUGINN_SEMGREP_IMAGE: docker.io/semgrep/semgrep:1.177.0
  HUGINN_UNPACK_IMAGE: docker.io/library/python:3.13-slim
  HUGINN_EXCERPT_RADIUS: "20"

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Legion Runner
        uses: Wraith-security/legion_runner@b459e7433723418301974a1f05098607b7e8d027
        with:
          egress-policy: audit
          file-integrity: auto
          ebpf: auto

      - name: Checkout
        uses: actions/checkout@v7

      - name: Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Configure trusted scanner cache
        shell: bash
        run: |
          set -euo pipefail
          CACHE_DIR="$RUNNER_TEMP/huginn-trivy-review"
          mkdir -p "$CACHE_DIR"
          echo "HUGINN_TRIVY_CACHE_VOLUME=$CACHE_DIR" >> "$GITHUB_ENV"

      - name: Install Huginn
        run: python -m pip install .

      - name: Prepare scanner images and Trivy database
        shell: bash
        run: |
          set -euo pipefail
          podman pull "$HUGINN_UNPACK_IMAGE"
          podman pull "$HUGINN_TRIVY_IMAGE"
          podman pull "$HUGINN_SEMGREP_IMAGE"
          podman run --rm \
            -v "$HUGINN_TRIVY_CACHE_VOLUME:/cache:rw,Z" \
            "$HUGINN_TRIVY_IMAGE" --cache-dir /cache image --download-db-only
          test -f "$HUGINN_TRIVY_CACHE_VOLUME/db/trivy.db"

      - name: Reproduce Hunt 002 candidate findings
        run: python scripts/review_hunt002_candidates.py

      - name: Trace candidate source boundaries
        run: python scripts/trace_hunt002_candidates.py

      - name: Trace candidate input provenance
        run: python scripts/provenance_hunt002_candidates.py

      - name: Review secondary static candidates
        run: python scripts/review_secondary_candidates.py

      - name: Trace Volcengine secure channel
        run: python scripts/trace_volcengine_jsc.py

      - name: Recheck Volcengine public advisories
        env:
          HUGINN_GITHUB_TOKEN: ${{ github.token }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: python scripts/recheck_volcengine_advisories.py

      - name: Upload candidate review packet
        uses: actions/upload-artifact@v4
        with:
          name: huginn-hunt002-candidate-review-${{ github.run_id }}
          path: candidate-review
          retention-days: 30
          if-no-files-found: error
