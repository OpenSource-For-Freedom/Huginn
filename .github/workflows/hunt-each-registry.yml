name: Huginn Hunt Each Registry

# Starts one independent "Huginn CVE Capture" run per registry. Each run has its own
# concurrency queue, its own capture and aggregate jobs, and its own ledger commit, so a
# slow or failing registry no longer holds up or reddens the others.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: First-publish, new-version, or both
        required: true
        type: choice
        default: all
        options: [all, updates, new]
      limit:
        description: Releases per ecosystem, or auto for the budgeted defaults (go 300, pypi 400, npm 400, crates 200, rubygems 200, packagist 120)
        required: true
        default: "auto"
      window_days:
        description: Look back this many days (every release is listed; a spread-out selection up to the limit is scanned)
        required: true
        default: "15"
  # Twice a month, 06:17 UTC on the 1st and 15th. Each run looks back 15 days, so the two runs
  # together cover the month. The budget job below still refuses a run that would overspend.
  schedule:
    - cron: "17 6 1,15 * *"

permissions:
  contents: read

jobs:
  # Budget guard (GitHub Pro: 3,000 included minutes). If this month's minutes plus this run's cap
  # would pass the budget (repository variable HUGINN_MONTHLY_MINUTES, default 2900), the run is
  # scaled down to the minutes left; it is refused only when fewer than 150 remain.
  budget:
    name: Check Actions budget
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      scale: ${{ steps.minutes.outputs.scale }}

    steps:
      - name: Legion Runner
        uses: Wraith-security/legion_runner@b459e7433723418301974a1f05098607b7e8d027
        with:
          egress-policy: audit
          file-integrity: auto

      - name: Month-to-date minutes
        id: minutes
        env:
          GH_TOKEN: ${{ github.token }}
          BUDGET: ${{ vars.HUGINN_MONTHLY_MINUTES || '2900' }}
          # The per-registry caps below (790) plus setup and reporting jobs (~30).
          PLANNED: "820"
        # Each job is billed rounded up to the minute. Dependabot (event "dynamic") is not billed.
        # Counts from the first of the month (UTC); the billing cycle may differ, so it is an estimate.
        run: |
          python3 - <<'PY'
          import json, math, os, sys, urllib.request
          from datetime import UTC, datetime

          def get(path):
              req = urllib.request.Request(
                  f"{os.environ['GITHUB_API_URL']}{path}",
                  headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                           "Accept": "application/vnd.github+json"})
              with urllib.request.urlopen(req, timeout=30) as resp:
                  return json.load(resp)

          def ts(value):
              return datetime.fromisoformat(value.replace("Z", "+00:00"))

          now = datetime.now(UTC)
          repo = os.environ["GITHUB_REPOSITORY"]
          used, page = 0, 1
          while True:
              runs = get(f"/repos/{repo}/actions/runs?created=%3E%3D{now:%Y-%m-01}&per_page=100&page={page}")["workflow_runs"]
              for run in runs:
                  if run.get("event") == "dynamic":
                      continue
                  for job in get(f"/repos/{repo}/actions/runs/{run['id']}/jobs?filter=all&per_page=100")["jobs"]:
                      if not job.get("started_at") or job.get("conclusion") == "skipped":
                          continue
                      end = ts(job["completed_at"]) if job.get("completed_at") else now
                      seconds = (end - ts(job["started_at"])).total_seconds()
                      if seconds > 0:
                          used += max(1, math.ceil(seconds / 60))
              if len(runs) < 100:
                  break
              page += 1

          budget, planned = int(os.environ["BUDGET"]), int(os.environ["PLANNED"])
          remaining = budget - used
          ok = remaining >= 150
          scale = 1.0 if remaining >= planned else max(0.0, remaining / planned)
          lines = [f"Minutes used this month (estimate): {used}", f"Monthly budget: {budget} (remaining {remaining})",
                   f"Full run is capped at about {planned} minutes"]
          if not ok:
              lines.append("Budget check: REFUSED - fewer than 150 minutes left this month")
          elif scale < 1:
              lines.append(f"Budget check: OK, scaled to {scale:.0%} (about {int(planned * scale)} minutes)")
          else:
              lines.append("Budget check: OK")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"scale={scale:.3f}\n")
          print("\n".join(lines))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("### Actions budget\n\n" + "".join(f"- {line}\n" for line in lines))
          sys.exit(0 if ok else 1)
          PY

  dispatch:
    name: Start ${{ matrix.ecosystem }} hunt
    needs: budget
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    strategy:
      fail-fast: false
      matrix:
        # limit = default releases to scan; minutes = hard cap on the capture (about 0.35-0.55 min
        # per package, measured October 2026). One full run stays near 820 Actions minutes, so two
        # runs a month (about 1,640) leave room in the 3,000 included minutes.
        include:
          - {ecosystem: npm, limit: 400, minutes: 160}
          - {ecosystem: pypi, limit: 400, minutes: 190}
          - {ecosystem: rubygems, limit: 200, minutes: 90}
          - {ecosystem: crates, limit: 200, minutes: 100}
          - {ecosystem: packagist, limit: 120, minutes: 70}
          - {ecosystem: go, limit: 300, minutes: 180}

    steps:
      - name: Legion Runner
        uses: Wraith-security/legion_runner@b459e7433723418301974a1f05098607b7e8d027
        with:
          egress-policy: audit
          file-integrity: auto

      - name: Dispatch ${{ matrix.ecosystem }} capture
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode || 'all' }}
          LIMIT: ${{ inputs.limit || 'auto' }}
          DEFAULT_LIMIT: ${{ matrix.limit }}
          MAX_MINUTES: ${{ matrix.minutes }}
          WINDOW_DAYS: ${{ inputs.window_days || '15' }}
          ECOSYSTEM: ${{ matrix.ecosystem }}
          SCALE: ${{ needs.budget.outputs.scale }}
        run: |
          if [ "$LIMIT" = "auto" ]; then LIMIT="$DEFAULT_LIMIT"; fi
          if ! [[ "$LIMIT" =~ ^[0-9]{1,4}$ ]]; then
            echo "::error::limit must be auto or a whole number"; exit 1
          fi
          if ! [[ "$SCALE" =~ ^[01]\.[0-9]{3}$ ]]; then
            echo "::error::budget job did not report a scale"; exit 1
          fi
          # Shrink the batch and its minute cap to fit what is left of the monthly budget.
          LIMIT=$(awk -v n="$LIMIT" -v f="$SCALE" 'BEGIN { v = int(n * f); print (v < 10 ? 10 : v) }')
          MAX_MINUTES=$(awk -v n="$MAX_MINUTES" -v f="$SCALE" 'BEGIN { v = int(n * f); print (v < 10 ? 10 : v) }')
          echo "$ECOSYSTEM: limit $LIMIT, capped at $MAX_MINUTES minutes"
          
          gh workflow run cve-capture.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME" \
            -f registry="$ECOSYSTEM" -f mode="$MODE" -f limit="$LIMIT" -f window_days="$WINDOW_DAYS" \
            -f max_minutes="$MAX_MINUTES"
