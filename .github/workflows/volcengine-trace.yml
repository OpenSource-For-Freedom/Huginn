name: Volcengine Candidate Trace

on:
  push:
    branches:
      - feature/security-candidate-review

permissions:
  contents: read

env:
  HUGINN_UNPACK_IMAGE: docker.io/library/python:3.13-slim

jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Legion Runner
        uses: Wraith-security/legion_runner@b459e7433723418301974a1f05098607b7e8d027
        with:
          egress-policy: audit
          file-integrity: auto
          ebpf: auto

      - name: Checkout
        uses: actions/checkout@v7

      - name: Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Huginn
        run: python -m pip install .

      - name: Pull static unpack image
        run: podman pull "$HUGINN_UNPACK_IMAGE"

      - name: Trace secure-channel trust boundary
        run: python scripts/trace_volcengine_jsc.py

      - name: Scope candidate across PyPI releases
        run: python scripts/scope_volcengine_versions.py

      - name: Upload trace
        uses: actions/upload-artifact@v4
        with:
          name: volcengine-static-trace-${{ github.run_id }}
          path: |
            candidate-review/volcengine_jsc_trace.json
            candidate-review/volcengine_version_scope.json
          retention-days: 30
          if-no-files-found: error
