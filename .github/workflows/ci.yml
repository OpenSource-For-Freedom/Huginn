name: Huginn CI

on:
  pull_request:
    branches: [Primary]
  push:
    branches:
      - "feature/**"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
