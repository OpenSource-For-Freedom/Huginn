name: Huginn CI

on:
  # Manual only: run it from the Actions tab (Run workflow). No push, PR or schedule triggers.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Legion Runner
        uses: Wraith-security/legion_runner@b459e7433723418301974a1f05098607b7e8d027
        with:
          egress-policy: audit
          file-integrity: auto
          ebpf: auto

      - name: Checkout
        uses: actions/checkout@v7
      - name: Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

  advisory-smoke:
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src
      HUGINN_GITHUB_TOKEN: ${{ github.token }}
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    steps:
      - name: Legion Runner
        uses: Wraith-security/legion_runner@b459e7433723418301974a1f05098607b7e8d027
        with:
          egress-policy: audit
          file-integrity: auto
          ebpf: auto

      - name: Checkout
        uses: actions/checkout@v7
      - name: Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Live advisory source checks
        run: python scripts/advisory_smoke.py

  scanner-engine-smoke:
    needs: unit-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HUGINN_TRIVY_IMAGE: docker.io/aquasec/trivy:0.74.0
      HUGINN_SEMGREP_IMAGE: docker.io/semgrep/semgrep:1.177.0
      HUGINN_UNPACK_IMAGE: docker.io/library/python:3.13-slim
    steps:
      - name: Legion Runner
        uses: Wraith-security/legion_runner@b459e7433723418301974a1f05098607b7e8d027
        with:
          egress-policy: audit
          file-integrity: auto
          ebpf: auto

      - name: Checkout
        uses: actions/checkout@v7
      - name: Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install Huginn
        run: python -m pip install .
      - name: Configure trusted Trivy cache
        shell: bash
        run: |
          set -euo pipefail
          CACHE_DIR="$RUNNER_TEMP/huginn-trivy-ci"
          mkdir -p "$CACHE_DIR"
          echo "HUGINN_TRIVY_CACHE_VOLUME=$CACHE_DIR" >> "$GITHUB_ENV"
      - name: Prepare scanner images and Trivy database
        shell: bash
        run: |
          set -euo pipefail
          podman pull "$HUGINN_UNPACK_IMAGE"
          podman pull "$HUGINN_TRIVY_IMAGE"
          podman pull "$HUGINN_SEMGREP_IMAGE"
          podman run --rm \
            -v "$HUGINN_TRIVY_CACHE_VOLUME:/cache:rw,Z" \
            "$HUGINN_TRIVY_IMAGE" --cache-dir /cache image --download-db-only
          test -f "$HUGINN_TRIVY_CACHE_VOLUME/db/trivy.db"
      - name: Validate scanner engines and rule regressions
        run: python scripts/scanner_smoke.py
