name: Hunt 002 Candidate Review

on:
  push:
    branches:
      - feature/review-hunt002

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Legion Runner
        uses: Wraith-security/legion_runner@b459e7433723418301974a1f05098607b7e8d027
        with:
          egress-policy: audit
          file-integrity: auto
          ebpf: auto

      - name: Checkout
        uses: actions/checkout@v7

      - name: Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Extract exact published source excerpts
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations
          import hashlib, io, json, tarfile, urllib.request
          from pathlib import PurePosixPath

          TARGETS = [
              {
                  "name":"archcheck 0.26.0",
                  "url":"https://files.pythonhosted.org/packages/c3/3b/edce9bd91eec2de5bf7661e3bfd93703087e6d00c41f76e566af2083e84c/archcheck-0.26.0.tar.gz",
                  "sha256":"e6864a52e1bf8f549efb86ff7c455943fab7da06f3f59e9b6dbfb27443018830",
                  "path_suffix":"src/archcheck/semantic.py",
                  "lines":[997],
              },
              {
                  "name":"archcheck 0.26.0",
                  "url":"https://files.pythonhosted.org/packages/c3/3b/edce9bd91eec2de5bf7661e3bfd93703087e6d00c41f76e566af2083e84c/archcheck-0.26.0.tar.gz",
                  "sha256":"e6864a52e1bf8f549efb86ff7c455943fab7da06f3f59e9b6dbfb27443018830",
                  "path_suffix":"src/archcheck/templates/report.html",
                  "lines":[315,522,546,554,575,817,835,848,875,886,894,898],
              },
              {
                  "name":"gitomb 0.1.0",
                  "url":"https://files.pythonhosted.org/packages/41/0b/50b59ed975c65790b2a3d177919f1aee5732e402e0c79c2a8337a8dd0ae5/gitomb-0.1.0.tar.gz",
                  "sha256":"0e1a76b21de6bad958b8b18d92a859c0168e4a0ca0eaa1820df90355867d4bf6",
                  "path_suffix":"src/gitomb/git.py",
                  "lines":[14],
              },
              {
                  "name":"volcengine-python-sdk-aicc 0.0.41",
                  "url":"https://files.pythonhosted.org/packages/ce/13/2064b8ff62237f906b662a4e7bb0b7582313c8d47abf3960447d0ec8ae8c/volcengine_python_sdk_aicc-0.0.41.tar.gz",
                  "sha256":"2aae4691780916114ad477ebbb6c09eaff2c597b1a60b02c8905efd4b70944ab",
                  "path_suffix":"bytedance/volcengine_aicc_sdk/asr_websocket_client.py",
                  "lines":[458],
              },
              {
                  "name":"volcengine-python-sdk-aicc 0.0.41",
                  "url":"https://files.pythonhosted.org/packages/ce/13/2064b8ff62237f906b662a4e7bb0b7582313c8d47abf3960447d0ec8ae8c/volcengine_python_sdk_aicc-0.0.41.tar.gz",
                  "sha256":"2aae4691780916114ad477ebbb6c09eaff2c597b1a60b02c8905efd4b70944ab",
                  "path_suffix":"bytedance/volcengine_aicc_sdk/deepseek_inference_client.py",
                  "lines":[35,90,160,220,277],
              },
              {
                  "name":"bluet-mcp 0.4.2",
                  "url":"https://registry.npmjs.org/bluet-mcp/-/bluet-mcp-0.4.2.tgz",
                  "sha256":"84c91bbe07e9c8c47d9bf448d3d581f3c31ff68dece2dc370232be6ab5843c9f",
                  "path_suffix":"package/mcp.mjs",
                  "lines":[450,471,472,525,526,558,560],
              },
              {
                  "name":"search-gateway 1.0.3.post20260923",
                  "url":"https://files.pythonhosted.org/packages/e5/50/8ecf37e98da343a58e9b9bdfb43fe8cc96b732a8b5098ce67535f57e72ca/search_gateway-1.0.3.post20260923.tar.gz",
                  "sha256":"1dceb87b9d92d72af87ad23265b8b24a8d962d40ad4ad57195bfb376d51c769b",
                  "path_suffix":"search_gateway/static/assets/index-CT4xRkVZ.js",
                  "lines":[284],
              },
              {
                  "name":"webteam-agents 0.2.0",
                  "url":"https://files.pythonhosted.org/packages/ed/7f/2bbac34bee9f550dbd24fe721f0713ef7ad2337c070511cd2571a6250648/webteam_agents-0.2.0.tar.gz",
                  "sha256":"42f0300c7fe6bb97b5574640ff50b5747f9eee7bdc2f4a9ea71998b47eac75e7",
                  "path_suffix":"src/webteam/project.py",
                  "lines":[151],
              },
          ]

          cache = {}
          output = []
          for target in TARGETS:
              key = (target["url"], target["sha256"])
              if key not in cache:
                  req = urllib.request.Request(target["url"], headers={"User-Agent":"Huginn-static-review/1"})
                  with urllib.request.urlopen(req, timeout=30) as r:
                      blob = r.read()
                  digest = hashlib.sha256(blob).hexdigest()
                  if digest != target["sha256"]:
                      raise SystemExit(f"sha256 mismatch for {target['name']}: {digest}")
                  cache[key] = blob
              blob = cache[key]

              with tarfile.open(fileobj=io.BytesIO(blob), mode="r:gz") as tf:
                  member = next(
                      (m for m in tf.getmembers()
                       if m.isfile() and PurePosixPath(m.name).as_posix().endswith(target["path_suffix"])),
                      None,
                  )
                  if member is None:
                      raise SystemExit(f"missing {target['path_suffix']} in {target['name']}")
                  f = tf.extractfile(member)
                  assert f is not None
                  text = f.read().decode("utf-8", "replace")
                  lines = text.splitlines()
                  for line_no in target["lines"]:
                      start = max(1, line_no - 25)
                      end = min(len(lines), line_no + 25)
                      excerpt = "\n".join(f"{i:5d}: {lines[i-1]}" for i in range(start, end + 1))
                      output.append({
                          "package": target["name"],
                          "artifact_sha256": target["sha256"],
                          "member": member.name,
                          "line": line_no,
                          "excerpt": excerpt,
                      })

          # Deep inspection of the bundled secure-channel implementation without importing it.
          volc_blob = cache[(
              "https://files.pythonhosted.org/packages/ce/13/2064b8ff62237f906b662a4e7bb0b7582313c8d47abf3960447d0ec8ae8c/volcengine_python_sdk_aicc-0.0.41.tar.gz",
              "2aae4691780916114ad477ebbb6c09eaff2c597b1a60b02c8905efd4b70944ab",
          )]
          secure_channel = []
          with tarfile.open(fileobj=io.BytesIO(volc_blob), mode="r:gz") as tf:
              for member in tf.getmembers():
                  name = PurePosixPath(member.name).as_posix()
                  if not member.isfile() or not name.endswith(".py"):
                      continue
                  if "jeddak_secure_channel" not in name and not name.endswith("aicc_inference.py"):
                      continue
                  fh = tf.extractfile(member)
                  if fh is None:
                      continue
                  source = fh.read().decode("utf-8", "replace")
                  lines = source.splitlines()
                  terms = ("encrypt_with_response", "def decrypt", "attest", "attest_must", "verify", "AES", "GCM", "base_url", "ClientConfig")
                  for lineno, line in enumerate(lines, 1):
                      if any(term.lower() in line.lower() for term in terms):
                          start = max(1, lineno - 8)
                          end = min(len(lines), lineno + 12)
                          excerpt = "\n".join(f"{i:5d}: {lines[i-1]}" for i in range(start, end + 1))
                          secure_channel.append({"member": name, "line": lineno, "excerpt": excerpt})

          review_doc = {"findings": output, "secure_channel": secure_channel}
          with open("candidate_review.json", "w", encoding="utf-8") as fh:
              json.dump(review_doc, fh, indent=2, ensure_ascii=False)
          for item in output:
              print("\n" + "=" * 90)
              print(item["package"], item["member"], "line", item["line"])
              print(item["excerpt"])
          print("\nSECURE CHANNEL STATIC MATCHES")
          for item in secure_channel:
              print("\n" + "-" * 90)
              print(item["member"], "line", item["line"])
              print(item["excerpt"])
          PY

      - name: Establish Volcengine affected version scope
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations
          import hashlib, io, json, tarfile, urllib.request

          req = urllib.request.Request(
              "https://pypi.org/pypi/volcengine-python-sdk-aicc/json",
              headers={"User-Agent":"Huginn-static-review/1"},
          )
          with urllib.request.urlopen(req, timeout=30) as r:
              meta = json.load(r)

          rows = []
          for version, files in (meta.get("releases") or {}).items():
              sdist = next((item for item in files if item.get("packagetype") == "sdist"), None)
              if not sdist:
                  continue
              url = sdist["url"]
              expected = (sdist.get("digests") or {}).get("sha256") or ""
              try:
                  with urllib.request.urlopen(
                      urllib.request.Request(url, headers={"User-Agent":"Huginn-static-review/1"}),
                      timeout=30,
                  ) as r:
                      blob = r.read()
                  digest = hashlib.sha256(blob).hexdigest()
                  if expected and digest != expected:
                      raise ValueError("sha256 mismatch")

                  pickle_path = False
                  fail_open = False
                  with tarfile.open(fileobj=io.BytesIO(blob), mode="r:gz") as tf:
                      for member in tf.getmembers():
                          if not member.isfile() or not member.name.endswith(".py"):
                              continue
                          fh = tf.extractfile(member)
                          if fh is None:
                              continue
                          src = fh.read().decode("utf-8", "replace")
                          if member.name.endswith("deepseek_inference_client.py"):
                              pickle_path = "pickle.loads(encrypt_key.decrypt" in src
                          if member.name.endswith("jeddak_secure_channel/ra.py"):
                              fail_open = "attest_must: bool = False" in src
                  rows.append({
                      "version": version,
                      "upload_time": sdist.get("upload_time_iso_8601") or sdist.get("upload_time"),
                      "sha256": digest,
                      "pickle_response_deserialization": pickle_path,
                      "attestation_fail_open_default": fail_open,
                      "combined_candidate": pickle_path and fail_open,
                  })
              except Exception as exc:
                  rows.append({"version":version,"error":f"{type(exc).__name__}: {exc}"})

          rows.sort(key=lambda row: row.get("upload_time") or "")
          with open("version_scope.json","w",encoding="utf-8") as fh:
              json.dump(rows, fh, indent=2)
          print(json.dumps(rows, indent=2))
          PY

      - name: Upload review evidence
        uses: actions/upload-artifact@v4
        with:
          name: hunt-002-candidate-review-${{ github.run_id }}
          path: |
            candidate_review.json
            version_scope.json
          retention-days: 30
          if-no-files-found: error
