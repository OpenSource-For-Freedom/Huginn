name: Hunt 002 Candidate Review

on:
  push:
    branches:
      - feature/security-hunt002-review

permissions:
  contents: read

env:
  HUGINN_TRIVY_IMAGE: docker.io/aquasec/trivy:0.74.0
  HUGINN_SEMGREP_IMAGE: docker.io/semgrep/semgrep:1.177.0
  HUGINN_UNPACK_IMAGE: docker.io/library/python:3.13-slim
  HUGINN_GITHUB_TOKEN: ${{ github.token }}
  NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Legion Runner
        uses: Wraith-security/legion_runner@b459e7433723418301974a1f05098607b7e8d027
        with:
          egress-policy: audit
          file-integrity: auto
          ebpf: auto

      - name: Checkout
        uses: actions/checkout@v7

      - name: Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Configure trusted scanner cache
        shell: bash
        run: |
          set -euo pipefail
          CACHE_DIR="$RUNNER_TEMP/huginn-trivy-review-cache"
          mkdir -p "$CACHE_DIR"
          echo "HUGINN_TRIVY_CACHE_VOLUME=$CACHE_DIR" >> "$GITHUB_ENV"

      - name: Install Huginn
        run: python -m pip install .

      - name: Prepare scanners
        shell: bash
        run: |
          set -euo pipefail
          podman pull "$HUGINN_UNPACK_IMAGE"
          podman pull "$HUGINN_TRIVY_IMAGE"
          podman pull "$HUGINN_SEMGREP_IMAGE"
          podman run --rm \
            -v "$HUGINN_TRIVY_CACHE_VOLUME:/cache:rw,Z" \
            "$HUGINN_TRIVY_IMAGE" --cache-dir /cache image --download-db-only
          test -f "$HUGINN_TRIVY_CACHE_VOLUME/db/trivy.db"

      - name: Validate scanner engines
        run: python scripts/scanner_smoke.py

      - name: Review exact Hunt 002 candidates
        shell: bash
        run: |
          set -euo pipefail
          python scripts/review_exact_candidates.py \
            --candidate pypi:archcheck:0.26.0 \
            --candidate pypi:gitomb:0.1.0 \
            --candidate pypi:volcengine-python-sdk-aicc:0.0.41 \
            --candidate pypi:webteam-agents:0.2.0 \
            --candidate pypi:search-gateway:1.0.3.post20260923 \
            --candidate npm:bluet-mcp:0.4.2 \
            --output candidate-review

      - name: Upload review packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hunt002-candidate-review-${{ github.run_id }}
          path: candidate-review
          retention-days: 30
          if-no-files-found: error
