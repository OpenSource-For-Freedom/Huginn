  - id: huginn.c.unsafe-buffer-copy
    message: Unsafe C/C++ buffer operation requires bounds and input-length review.
    severity: ERROR
    languages: [c, cpp]
    pattern-either:
      - pattern: strcpy(...)
      - pattern: strcat(...)
      - pattern: gets(...)
      - pattern: sprintf(...)
      - pattern: vsprintf(...)
    metadata:
      huginn_category: buffer_overflow
      huginn_confidence: MEDIUM
      huginn_validation: sink_only
      huginn_source_to_sink: false
      huginn_source: input length and destination capacity must be established manually
      huginn_sink: unsafe buffer copy or formatting primitive
      cwe: CWE-120
      suspicious_package: false

  - id: huginn.c.variable-length-memory-copy
    message: Variable-length C/C++ memory copy requires destination-capacity and length provenance review.
    severity: WARNING
    languages: [c, cpp]
    pattern-either:
      - pattern: memcpy($DST, $SRC, $LEN)
      - pattern: memmove($DST, $SRC, $LEN)
    metadata:
      huginn_category: buffer_overflow
      huginn_confidence: LOW
      huginn_validation: sink_only
      huginn_source_to_sink: false
      huginn_source: copy length provenance must be established manually
      huginn_sink: raw memory copy
      cwe: CWE-120
      suspicious_package: false

  - id: huginn.c.allocation-arithmetic
    message: Allocation size arithmetic may overflow or under-allocate and requires integer-range review.
    severity: WARNING
    languages: [c, cpp]
    pattern-either:
      - pattern: malloc($A * $B)
      - pattern: realloc($PTR, $A * $B)
      - pattern: new $T[$A * $B]
    metadata:
      huginn_category: integer_overflow_allocation
      huginn_confidence: LOW
      huginn_validation: sink_only
      huginn_source_to_sink: false
      huginn_source: allocation operands must be range-checked manually
      huginn_sink: allocation-size arithmetic
      cwe: CWE-190
      suspicious_package: false

