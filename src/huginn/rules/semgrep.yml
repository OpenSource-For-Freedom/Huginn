rules:
  - id: huginn.python.dynamic-eval-sink
    message: Python dynamic evaluation primitive requires manual trust-boundary review.
    severity: WARNING
    languages: [python]
    pattern-either:
      - pattern: eval(...)
      - pattern: exec(...)
    metadata:
      huginn_category: dynamic_code_execution
      huginn_confidence: LOW
      huginn_validation: sink_only
      huginn_source_to_sink: false
      huginn_source: attacker-controlled input must be established manually
      huginn_sink: Python dynamic evaluation
      cwe: CWE-95
      suspicious_package: false

  - id: huginn.javascript.dynamic-eval-sink
    message: JavaScript dynamic evaluation primitive requires manual trust-boundary review.
    severity: WARNING
    languages: [javascript, typescript]
    pattern: eval(...)
    metadata:
      huginn_category: dynamic_code_execution
      huginn_confidence: LOW
      huginn_validation: sink_only
      huginn_source_to_sink: false
      huginn_source: attacker-controlled input must be established manually
      huginn_sink: JavaScript dynamic evaluation
      cwe: CWE-95
      suspicious_package: false

  - id: huginn.ruby.dynamic-eval-sink
    message: Ruby dynamic evaluation primitive requires manual trust-boundary review.
    severity: WARNING
    languages: [ruby]
    pattern-either:
      - pattern: eval(...)
      - pattern: instance_eval(...)
      - pattern: class_eval(...)
    metadata:
      huginn_category: dynamic_code_execution
      huginn_confidence: LOW
      huginn_validation: sink_only
      huginn_source_to_sink: false
      huginn_source: attacker-controlled input must be established manually
      huginn_sink: Ruby dynamic evaluation
      cwe: CWE-95
      suspicious_package: false

  - id: huginn.generic.command-execution
    message: Command execution primitive requires manual source-to-sink verification.
    severity: ERROR
    languages: [generic]
    pattern-regex: '(child_process\.(exec|execSync)|Runtime\.getRuntime\(\)\.exec|os\.system)\s*\('
    metadata:
      huginn_category: command_execution
      huginn_confidence: MEDIUM
      huginn_validation: sink_only
      huginn_source_to_sink: false
      huginn_source: attacker-controlled argument must be established manually
      huginn_sink: operating-system command execution
      cwe: CWE-78
      suspicious_package: false

  - id: huginn.generic.unsafe-deserialization
    message: Unsafe deserialization primitive requires manual reachability and input-origin review.
    severity: ERROR
    languages: [generic]
    pattern-regex: '(pickle\.loads?|yaml\.unsafe_load|Marshal\.load|ObjectInputStream|unserialize)\s*\('
    metadata:
      huginn_category: unsafe_deserialization
      huginn_confidence: MEDIUM
      huginn_validation: sink_only
      huginn_source_to_sink: false
      huginn_source: serialized input origin must be established manually
      huginn_sink: deserialization primitive
      cwe: CWE-502
      suspicious_package: false

  - id: huginn.generic.xss-sink
    message: Browser HTML injection sink requires manual input/sanitization review.
    severity: WARNING
    languages: [generic]
    pattern-regex: '(innerHTML\s*=|dangerouslySetInnerHTML|document\.write\s*\()'
    metadata:
      huginn_category: xss_sink
      huginn_confidence: LOW
      huginn_validation: sink_only
      huginn_source_to_sink: false
      huginn_source: untrusted web input must be established manually
      huginn_sink: HTML/DOM rendering sink
      cwe: CWE-79
      suspicious_package: false

  - id: huginn.generic.reverse-shell-indicator
    message: Reverse-shell-like indicator. Route to suspicious-package review, not directly to CVE disclosure.
    severity: ERROR
    languages: [generic]
    pattern-regex: '(/dev/tcp/|\bnc\s+[^\n]{0,80}\s-e\s|bash\s+-i\b|powershell[^\n]{0,120}-(enc|encodedcommand)\b)'
    metadata:
      huginn_category: reverse_shell_indicator
      huginn_confidence: MEDIUM
      huginn_validation: indicator
      huginn_source_to_sink: false
      huginn_source: static indicator only
      huginn_sink: suspicious package behavior
      suspicious_package: true

  - id: huginn.python.shell-command-execution
    message: Python subprocess explicitly invokes a shell and requires command provenance review.
    severity: ERROR
    languages: [python]
    patterns:
      - pattern-either:
          - pattern: subprocess.run(..., shell=True, ...)
          - pattern: subprocess.Popen(..., shell=True, ...)
          - pattern: subprocess.call(..., shell=True, ...)
          - pattern: subprocess.check_call(..., shell=True, ...)
          - pattern: subprocess.check_output(..., shell=True, ...)
    metadata:
      huginn_category: command_execution
      huginn_confidence: MEDIUM
      huginn_validation: sink_only
      huginn_source_to_sink: false
      huginn_source: shell command data provenance must be established manually
      huginn_sink: Python subprocess with shell=True
      cwe: CWE-78
      suspicious_package: false

  - id: huginn.python.network-response-unsafe-deserialization
    message: Network response data reaches an unsafe Python deserialization primitive.
    severity: ERROR
    languages: [python]
    mode: taint
    pattern-sources:
      - pattern: requests.get(...)
      - pattern: requests.post(...)
      - pattern: requests.request(...)
      - pattern: httpx.get(...)
      - pattern: httpx.post(...)
      - pattern: httpx.request(...)
      - pattern: urllib.request.urlopen(...)
    pattern-sinks:
      - pattern: pickle.loads(...)
      - pattern: yaml.unsafe_load(...)
    metadata:
      huginn_category: unsafe_deserialization
      huginn_confidence: HIGH
      huginn_validation: dataflow
      huginn_source_to_sink: true
      huginn_source: network response data
      huginn_sink: unsafe deserialization
      cwe: CWE-502
      suspicious_package: false

  - id: huginn.python.tainted-eval
    message: Untrusted Python input reaches eval/exec.
    severity: ERROR
    languages: [python]
    mode: taint
    pattern-sources:
      - pattern: input(...)
      - pattern: flask.request.args.get(...)
      - pattern: flask.request.form.get(...)
      - pattern: flask.request.get_json(...)
      - pattern: request.args.get(...)
      - pattern: request.form.get(...)
      - pattern: request.get_json(...)
      - pattern: $REQ.query_params.get(...)
    pattern-sinks:
      - pattern: eval(...)
      - pattern: exec(...)
    metadata:
      huginn_category: dynamic_code_execution
      huginn_confidence: HIGH
      huginn_validation: dataflow
      huginn_source_to_sink: true
      huginn_source: untrusted request or interactive input
      huginn_sink: eval/exec
      cwe: CWE-95
      suspicious_package: false

