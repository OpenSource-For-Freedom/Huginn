  - id: huginn.php.tainted-command-execution
    message: Untrusted PHP request input reaches operating-system command execution.
    severity: ERROR
    languages: [php]
    mode: taint
    pattern-sources:
      - pattern: $_GET
      - pattern: $_POST
      - pattern: $_REQUEST
      - pattern: $_COOKIE
      - pattern: $_SERVER['HTTP_$X']
      - patterns:
          - pattern-either:
              - pattern: $REQUEST->input(...)
              - pattern: $REQUEST->query(...)
              - pattern: $REQUEST->get(...)
          - metavariable-regex:
              metavariable: $REQUEST
              regex: (?i)^\$(request|req)$
    pattern-sinks:
      - pattern: system(...)
      - pattern: exec(...)
      - pattern: shell_exec(...)
      - pattern: passthru(...)
      - pattern: popen(...)
      - pattern: proc_open(...)
    pattern-sanitizers:
      - pattern: escapeshellarg(...)
    metadata:
      huginn_category: command_execution
      huginn_confidence: HIGH
      huginn_validation: dataflow
